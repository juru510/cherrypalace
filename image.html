<!DOCTYPE html>
<html lang="en">
<head>
    <title>CHERRY PALACE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cherry-purple': '#d4a3ff',
                        'cherry-hover': '#2effb9',
                        'cherry-accent': '#B55FFF',
                    },
                    fontFamily: {
                        'cherry': ['Helvetica', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom cursor */
        html {
            cursor: url('assets/icons/cursor.cur'), default;
        }

        a {
            cursor: url('assets/icons/cursor-hover.cur'), pointer;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #d4a3ff;
        }

        ::-webkit-scrollbar-thumb {
            background: #B55FFF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2effb9;
        }
    </style>
</head>
<body class="bg-cherry-purple font-cherry text-[9px] leading-[10px] uppercase text-black m-0">
    <!-- Top Navigation -->
    <div class="fixed top-0 left-0 right-0 bg-cherry-purple p-4 z-10">
        <div class="text-center">
            <h1 class="text-2xl font-bold mb-4">CHERRY PALACE</h1>
            <div class="flex justify-center space-x-8 mb-4">
                <a href="/music" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">MUSIC</a>
                <a href="/shop" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">SHOP</a>
                <a href="/ask" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">ASK</a>
                <a href="/contact" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">CONTACT</a>
            </div>
            <div class="flex justify-center space-x-4">
                <a href="https://open.spotify.com/artist/your-spotify-id" target="_blank">
                    <img src="assets/icons/spotify.png" alt="Spotify" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://instagram.com/your-instagram" target="_blank">
                    <img src="assets/icons/instagram.png" alt="Instagram" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://twitter.com/your-twitter" target="_blank">
                    <img src="assets/icons/twitter.png" alt="Twitter" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://youtube.com/your-youtube" target="_blank">
                    <img src="assets/icons/youtube.png" alt="YouTube" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://soundcloud.com/your-soundcloud" target="_blank">
                    <img src="assets/icons/soundcloud.png" alt="SoundCloud" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
            </div>
        </div>
    </div>

    

    <!-- Image Content -->
    <div class="p-5 pt-[180px] max-w-4xl mx-auto">
        <div class="max-w-4xl mx-auto">
            <!-- Back Button -->
            <div class="mb-4">
                <a href="./index.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">← BACK TO GALLERY</a>
            </div>
            
            <!-- Image Container -->
            <div class="bg-cherry-purple p-4">
                <div id="media-container" class="w-full">
                    <!-- Media will be loaded here -->
                </div>
                <div class="text-center py-[5px]">
                    <span id="date" class="text-black"></span>
                </div>
                <hr class="border-dotted border-cherry-accent w-full border-t-[0.2px] my-0">
            </div>
        </div>
    </div>

    <script>
        // Get the image index from the URL hash
        const imageIndex = window.location.hash.substring(1);
        
        // Array of all posts (same as in index.html)
        const posts = [
            {
                image: 'assets/hxh.webp',
                date: '12/12/23',
                permalink: 'hxh'
            },
            {
                image: 'assets/sonic.jpg',
                date: '12/11/23',
                permalink: 'sonic'
            },
            {
                image: 'assets/cherry palace.jpg',
                date: '12/11/23',
                permalink: 'cherry-palace'
            },
            {
                image: 'assets/tiki.webp',
                date: '12/10/23',
                permalink: 'tiki'
            },
            {
                image: 'assets/slan.jpg',
                date: '12/10/23',
                permalink: 'slan'
            },
            {
                image: 'assets/vapor dbz.jpg',
                date: '12/10/23',
                permalink: 'vapor-dbz'
            },
            {
                image: 'assets/vegeta.jpg',
                date: '12/10/23',
                permalink: 'vegeta'
            },
            {
                image: 'assets/yebear.jpg',
                date: '12/10/23',
                permalink: 'yebear'
            },
            {
                image: 'assets/pb.jpg',
                date: '12/10/23',
                permalink: 'pb'
            },
            {
                image: 'assets/odst.jpg',
                date: '12/10/23',
                permalink: 'odst'
            },
            {
                image: 'assets/mem.jpg',
                date: '12/10/23',
                permalink: 'mem'
            },
            {
                image: 'assets/grif.jpg',
                date: '12/10/23',
                permalink: 'grif'
            },
            {
                image: 'assets/heat.jpg',
                date: '12/10/23',
                permalink: 'heat'
            },
            {
                image: 'assets/jit.jpg',
                date: '12/10/23',
                permalink: 'jit'
            },
            {
                image: 'assets/eliot.jpg',
                date: '12/10/23',
                permalink: 'eliot'
            },
            {
                image: 'assets/ye copy.jpg',
                date: '09/07/23',
                permalink: 'ye'
            },
            {
                image: 'assets/scott.jpg',
                date: '02/17/23',
                permalink: 'scott'
            },
            {
                image: 'assets/dexter-1979 copy.mp4',
                date: '12/10/23',
                permalink: 'dexter'
            },
            {
                image: 'assets/damm.mp4',
                date: '12/10/23',
                permalink: 'damm'
            },
            {
                image: 'assets/silent.mp4',
                date: '12/10/23',
                permalink: 'silent'
            }
        ];

        // Find the post by permalink
        const post = posts.find(p => p.permalink === imageIndex);

        if (post) {
            const mediaContainer = document.getElementById('media-container');
            const dateElement = document.getElementById('date');
            
            // Set the date
            dateElement.textContent = post.date;
            
            // Create and append the media element
            if (post.image.endsWith('.mp4')) {
                const video = document.createElement('video');
                video.controls = true;
                video.className = 'w-full h-auto';
                const source = document.createElement('source');
                source.src = post.image;
                source.type = 'video/mp4';
                video.appendChild(source);
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = post.image;
                img.alt = 'Post';
                img.className = 'w-full h-auto';
                mediaContainer.appendChild(img);
            }
        } else {
            // Redirect to gallery if post not found
            window.location.href = '/';
        }
    </script>
</body>
</html>
