<!DOCTYPE html>
<html lang="en">
<head>
    <title>CHERRY PALACE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cherry-purple': '#d4a3ff',
                        'cherry-hover': '#2effb9',
                        'cherry-accent': '#B55FFF',
                    },
                    fontFamily: {
                        'cherry': ['Helvetica', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #d4a3ff;
        }

        ::-webkit-scrollbar-thumb {
            background: #B55FFF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2effb9;
        }
    </style>
</head>
<body class="bg-cherry-purple font-cherry text-[9px] leading-[10px] uppercase text-black m-0">
    <!-- Top Navigation -->
    <div class="fixed top-0 left-0 right-0 bg-cherry-purple p-4 z-10">
        <div class="text-center">
            <a href="index.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300 text-2xl font-bold mb-4 block" style="font-family: Georgia, serif;">CHERRY PALACE</a>
            <div class="flex justify-center space-x-8 mb-4">
                <a href="https://music.apple.com/us/library/playlist/p.RB1A8MbsYvQYddz?l=en-US" target="_blank" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">MUSIC</a>
                <a href="/shop" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">SHOP</a>
                <a href="contact.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">CONTACT</a>
                <a href="videos.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">VIDEOS</a>
            </div>
            <div class="flex justify-center space-x-4">
                <a href="https://www.tiktok.com/@singularitey?is_from_webapp=1&sender_device=pc" target="_blank">
                    <img src="assets/icons/tiktok.png" alt="TikTok" class="w-6 h-6 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://instagram.com/your-instagram" target="_blank">
                    <img src="assets/icons/Instagram_icon.png" alt="Instagram" class="w-6 h-6 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://letterboxd.com/cherryluver/" target="_blank">
                    <img src="assets/icons/letterboxd-mac-icon.png" alt="Letterboxd" class="w-6 h-6 hover:opacity-70 transition-opacity duration-300">
                </a>
            </div>
        </div>
    </div>

    

    <!-- Image Content -->
    <div class="p-5 pt-[180px] max-w-4xl mx-auto">
        <div class="max-w-4xl mx-auto">
            <!-- Back Button -->
            <div class="mb-4">
                <a href="./index.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">← BACK TO GALLERY</a>
            </div>
            
            <!-- Image Container -->
            <div class="bg-cherry-purple p-4">
                <div id="media-container" class="w-full">
                    <!-- Media will be loaded here -->
                </div>
                <div class="text-center py-[5px]">
                    <span id="date" class="text-black"></span>
                </div>
                <hr class="border-dotted border-cherry-accent w-full border-t-[0.2px] my-0">
            </div>
        </div>
    </div>

    <script>
        // Get the image index from the URL hash
        const imageIndex = window.location.hash.substring(1);
        
        // Array of all posts (same as in index.html)
        const posts = [
            {
                image: 'assets/hxh.webp',
                date: '12/12/23',
                permalink: 'hxh'
            },
            {
                image: 'assets/sonic.jpg',
                date: '12/11/23',
                permalink: 'sonic'
            },
            {
                image: 'assets/cherry palace.jpg',
                date: '12/11/23',
                permalink: 'cherry-palace'
            },
            {
                image: 'assets/tiki.webp',
                date: '12/10/23',
                permalink: 'tiki'
            },
            {
                image: 'assets/slan.jpg',
                date: '12/10/23',
                permalink: 'slan'
            },
            {
                image: 'assets/vapor dbz.jpg',
                date: '12/10/23',
                permalink: 'vapor-dbz'
            },
            {
                image: 'assets/vegeta.jpg',
                date: '12/10/23',
                permalink: 'vegeta'
            },
            {
                image: 'assets/yebear.jpg',
                date: '12/10/23',
                permalink: 'yebear'
            },
            {
                image: 'assets/pb.jpg',
                date: '12/10/23',
                permalink: 'pb'
            },
            {
                image: 'assets/odst.jpg',
                date: '12/10/23',
                permalink: 'odst'
            },
            {
                image: 'assets/mem.jpg',
                date: '12/10/23',
                permalink: 'mem'
            },
            {
                image: 'assets/grif.jpg',
                date: '12/10/23',
                permalink: 'grif'
            },
            {
                image: 'assets/heat.jpg',
                date: '12/10/23',
                permalink: 'heat'
            },
            {
                image: 'assets/jit.jpg',
                date: '12/10/23',
                permalink: 'jit'
            },
            {
                image: 'assets/eliot.jpg',
                date: '12/10/23',
                permalink: 'eliot'
            },
            {
                image: 'assets/dexter-1979 copy.mp4',
                date: '12/10/23',
                permalink: 'dexter'
            },
            {
                image: 'assets/damm.mp4',
                date: '12/10/23',
                permalink: 'damm'
            },
            {
                image: 'assets/silent.mp4',
                date: '12/10/23',
                permalink: 'silent'
            }
        ];

        // Find the post by permalink
        const post = posts.find(p => p.permalink === imageIndex);

        if (post) {
            const mediaContainer = document.getElementById('media-container');
            const dateElement = document.getElementById('date');
            
            // Set the date
            dateElement.textContent = post.date;
            
            // Create and append the media element
            if (post.image.endsWith('.mp4')) {
                const videoContainer = document.createElement('div');
                videoContainer.className = 'relative group flex items-center justify-center';
                
                const video = document.createElement('video');
                video.className = 'w-full h-auto max-h-[80vh] rounded-lg shadow-lg';
                video.controls = false;
                video.playsInline = true;
                
                const source = document.createElement('source');
                source.src = post.image;
                source.type = 'video/mp4';
                video.appendChild(source);
                
                // Custom controls overlay
                const controlsOverlay = document.createElement('div');
                controlsOverlay.className = 'absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300';
                
                const controls = document.createElement('div');
                controls.className = 'flex items-center space-x-4';
                
                // Play/Pause button
                const playButton = document.createElement('button');
                playButton.className = 'text-white hover:text-cherry-hover transition-colors duration-300';
                playButton.innerHTML = `
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path class="play-icon" d="M8 5v14l11-7z"/>
                        <path class="pause-icon hidden" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                `;
                
                // Volume control
                const volumeContainer = document.createElement('div');
                volumeContainer.className = 'flex items-center space-x-2';
                
                const volumeButton = document.createElement('button');
                volumeButton.className = 'text-white hover:text-cherry-hover transition-colors duration-300';
                volumeButton.innerHTML = `
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path class="volume-high" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        <path class="volume-mid hidden" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        <path class="volume-low hidden" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        <path class="volume-mute hidden" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                `;
                
                const volumeSlider = document.createElement('input');
                volumeSlider.type = 'range';
                volumeSlider.min = '0';
                volumeSlider.max = '1';
                volumeSlider.step = '0.1';
                volumeSlider.value = '1';
                volumeSlider.className = 'w-20 h-1 bg-white/30 rounded-full appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-cherry-hover';
                
                volumeContainer.appendChild(volumeButton);
                volumeContainer.appendChild(volumeSlider);
                
                // Progress bar
                const progressContainer = document.createElement('div');
                progressContainer.className = 'flex-1 h-1 bg-white/30 rounded-full mx-4 cursor-pointer';
                
                const progressBar = document.createElement('div');
                progressBar.className = 'h-full bg-cherry-hover rounded-full';
                progressContainer.appendChild(progressBar);
                
                // Time display
                const timeDisplay = document.createElement('div');
                timeDisplay.className = 'text-white text-[8px] font-mono';
                
                // Fullscreen button
                const fullscreenButton = document.createElement('button');
                fullscreenButton.className = 'text-white hover:text-cherry-hover transition-colors duration-300';
                fullscreenButton.innerHTML = `
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path class="fullscreen-enter" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        <path class="fullscreen-exit hidden" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                    </svg>
                `;
                
                controls.appendChild(playButton);
                controls.appendChild(progressContainer);
                controls.appendChild(timeDisplay);
                controls.appendChild(volumeContainer);
                controls.appendChild(fullscreenButton);
                controlsOverlay.appendChild(controls);
                
                videoContainer.appendChild(video);
                videoContainer.appendChild(controlsOverlay);
                mediaContainer.appendChild(videoContainer);
                
                // Add event listeners for custom controls
                playButton.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                        playButton.querySelector('.play-icon').classList.add('hidden');
                        playButton.querySelector('.pause-icon').classList.remove('hidden');
                    } else {
                        video.pause();
                        playButton.querySelector('.play-icon').classList.remove('hidden');
                        playButton.querySelector('.pause-icon').classList.add('hidden');
                    }
                });
                
                video.addEventListener('timeupdate', () => {
                    const progress = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = `${progress}%`;
                    
                    // Update time display
                    const minutes = Math.floor(video.currentTime / 60);
                    const seconds = Math.floor(video.currentTime % 60);
                    const durationMinutes = Math.floor(video.duration / 60);
                    const durationSeconds = Math.floor(video.duration % 60);
                    timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} / ${durationMinutes}:${durationSeconds.toString().padStart(2, '0')}`;
                });
                
                progressContainer.addEventListener('click', (e) => {
                    const rect = progressContainer.getBoundingClientRect();
                    const pos = (e.clientX - rect.left) / rect.width;
                    video.currentTime = pos * video.duration;
                });
                
                volumeSlider.addEventListener('input', (e) => {
                    video.volume = e.target.value;
                    updateVolumeIcon(volumeButton, video.volume);
                });
                
                volumeButton.addEventListener('click', () => {
                    if (video.volume > 0) {
                        video.volume = 0;
                        volumeSlider.value = 0;
                    } else {
                        video.volume = 1;
                        volumeSlider.value = 1;
                    }
                    updateVolumeIcon(volumeButton, video.volume);
                });
                
                fullscreenButton.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        videoContainer.requestFullscreen();
                        videoContainer.classList.add('flex', 'items-center', 'justify-center', 'bg-black');
                        video.classList.add('max-h-[90vh]');
                        fullscreenButton.querySelector('.fullscreen-enter').classList.add('hidden');
                        fullscreenButton.querySelector('.fullscreen-exit').classList.remove('hidden');
                    } else {
                        document.exitFullscreen();
                        videoContainer.classList.remove('flex', 'items-center', 'justify-center', 'bg-black');
                        video.classList.remove('max-h-[90vh]');
                        fullscreenButton.querySelector('.fullscreen-enter').classList.remove('hidden');
                        fullscreenButton.querySelector('.fullscreen-exit').classList.add('hidden');
                    }
                });
                
                function updateVolumeIcon(button, volume) {
                    const icons = button.querySelectorAll('path');
                    icons.forEach(icon => icon.classList.add('hidden'));
                    
                    if (volume === 0) {
                        button.querySelector('.volume-mute').classList.remove('hidden');
                    } else if (volume < 0.3) {
                        button.querySelector('.volume-low').classList.remove('hidden');
                    } else if (volume < 0.7) {
                        button.querySelector('.volume-mid').classList.remove('hidden');
                    } else {
                        button.querySelector('.volume-high').classList.remove('hidden');
                    }
                }
            } else {
                const img = document.createElement('img');
                img.src = post.image;
                img.alt = 'Post';
                img.className = 'w-full h-auto';
                mediaContainer.appendChild(img);
            }
        } else {
            // Redirect to gallery if post not found
            window.location.href = '/';
        }
    </script>
</body>
</html>
