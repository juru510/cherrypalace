    <script>
        // Theme switcher functionality
        function initThemeSwitcher() {
            const themeButtons = document.querySelectorAll('.theme-btn');
            const savedTheme = localStorage.getItem('cherrypalace-theme');
            
            // Apply saved theme if it exists
            if (savedTheme) {
                applyTheme(savedTheme);
                
                // Update active button
                themeButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.theme === savedTheme) {
                        btn.classList.add('active');
                    }
                });
            }
            
            // Add click event listeners to theme buttons
            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const theme = this.dataset.theme;
                    
                    // Update active button
                    themeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Apply theme
                    applyTheme(theme);
                    
                    // Save theme preference
                    localStorage.setItem('cherrypalace-theme', theme);
                });
            });
        }
        
        function applyTheme(theme) {
            const body = document.body;
            
            // Remove existing theme classes
            body.classList.remove('theme-enabled');
            body.removeAttribute('data-theme');
            
            // Apply new theme if not default
            if (theme !== 'default') {
                body.classList.add('theme-enabled');
                body.setAttribute('data-theme', theme);
            }
        }
        
        // Initialize theme switcher when page loads
        document.addEventListener('DOMContentLoaded', initThemeSwitcher);

                    } else {
                        video.volume = 1;
                        volumeSlider.value = 1;
                    }
                    updateVolumeIcon(volumeButton, video.volume);
                });
                
                fullscreenButton.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        videoContainer.requestFullscreen();
                        videoContainer.classList.add('flex', 'items-center', 'justify-center', 'bg-black');
                        video.classList.add('max-h-[90vh]');
                        fullscreenButton.querySelector('.fullscreen-enter').classList.add('hidden');
                        fullscreenButton.querySelector('.fullscreen-exit').classList.remove('hidden');
                    } else {
                        document.exitFullscreen();
                        videoContainer.classList.remove('flex', 'items-center', 'justify-center', 'bg-black');
                        video.classList.remove('max-h-[90vh]');
                        fullscreenButton.querySelector('.fullscreen-enter').classList.remove('hidden');
                        fullscreenButton.querySelector('.fullscreen-exit').classList.add('hidden');
                    }
                });
                
                function updateVolumeIcon(button, volume) {
                    const icons = button.querySelectorAll('path');
                    icons.forEach(icon => icon.classList.add('hidden'));
                    
                    if (volume === 0) {
                        button.querySelector('.volume-mute').classList.remove('hidden');
                    } else if (volume < 0.3) {
                        button.querySelector('.volume-low').classList.remove('hidden');
                    } else if (volume < 0.7) {
                        button.querySelector('.volume-mid').classList.remove('hidden');
                    } else {
                        button.querySelector('.volume-high').classList.remove('hidden');
                    }
                }
            } else {
                const img = document.createElement('img');
                img.src = post.image;
                img.alt = 'Post';
                img.className = 'w-full h-auto';
                mediaContainer.appendChild(img);
            }
        } else {
            // Redirect to gallery if post not found
            window.location.href = '/';
        }
    </script>
</body>
</html>
