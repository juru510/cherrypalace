<!DOCTYPE html>
<html lang="en">
<head>
    <title>CHERRY PALACE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cherry-purple': '#d4a3ff',
                        'cherry-hover': '#2effb9',
                        'cherry-accent': '#B55FFF',
                    },
                    fontFamily: {
                        'cherry': ['Helvetica', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #d4a3ff;
        }

        ::-webkit-scrollbar-thumb {
            background: #B55FFF;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2effb9;
        }
    </style>
</head>
<body class="bg-cherry-purple font-cherry text-[9px] leading-[10px] uppercase text-black m-0">
    <!-- Top Navigation -->
    <div class="fixed top-0 left-0 right-0 bg-cherry-purple p-4 z-10">
        <div class="text-center">
            <a href="index.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300 text-2xl font-bold mb-4 block" style="font-family: Georgia, serif;">CHERRY PALACE</a>
            <div class="flex justify-center space-x-8 mb-4">
                <a href="https://music.apple.com/us/library/playlist/p.RB1A8MbsYvQYddz?l=en-US" target="_blank" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">MUSIC</a>
                <a href="contact.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">CONTACT</a>
                <a href="videos.html" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">VIDEOS</a>
            </div>
            <div class="flex justify-center space-x-4">
                <a href="https://open.spotify.com/artist/your-spotify-id" target="_blank">
                    <img src="assets/icons/spotify.png" alt="Spotify" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://instagram.com/your-instagram" target="_blank">
                    <img src="assets/icons/instagram.png" alt="Instagram" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://twitter.com/your-twitter" target="_blank">
                    <img src="assets/icons/twitter.png" alt="Twitter" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://youtube.com/your-youtube" target="_blank">
                    <img src="assets/icons/youtube.png" alt="YouTube" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
                <a href="https://soundcloud.com/your-soundcloud" target="_blank">
                    <img src="assets/icons/soundcloud.png" alt="SoundCloud" class="w-8 h-8 hover:opacity-70 transition-opacity duration-300">
                </a>
            </div>
        </div>
    </div>

    <!-- Posts Grid -->
    <div class="p-5 pt-[180px] w-[900px] mx-auto">
        <div class="grid grid-cols-3 gap-2">
            <!-- Posts will be dynamically loaded here -->
        </div>
    </div>

    <script>
        const posts = [
            {
                image: 'assets/hxh.webp',
                date: '12/12/23',
                permalink: 'hxh'
            },
            {
                image: 'assets/sonic.jpg',
                date: '12/11/23',
                permalink: 'sonic'
            },
            {
                image: 'assets/cherry palace.jpg',
                date: '12/11/23',
                permalink: 'cherry-palace'
            },
            {
                image: 'assets/slan.jpg',
                date: '12/10/23',
                permalink: 'slan'
            },
            {
                image: 'assets/vapor dbz.jpg',
                date: '12/10/23',
                permalink: 'vapor-dbz'
            },
            {
                image: 'assets/vegeta.jpg',
                date: '12/10/23',
                permalink: 'vegeta'
            },
            {
                image: 'assets/yebear.jpg',
                date: '12/10/23',
                permalink: 'yebear'
            },
            {
                image: 'assets/pb.jpg',
                date: '12/10/23',
                permalink: 'pb'
            },
            {
                image: 'assets/odst.jpg',
                date: '12/10/23',
                permalink: 'odst'
            },
            {
                image: 'assets/mem.jpg',
                date: '12/10/23',
                permalink: 'mem'
            },
            {
                image: 'assets/grif.jpg',
                date: '12/10/23',
                permalink: 'grif'
            },
            {
                image: 'assets/heat.jpg',
                date: '12/10/23',
                permalink: 'heat'
            },
            {
                image: 'assets/jit.jpg',
                date: '12/10/23',
                permalink: 'jit'
            },
            {
                image: 'assets/eliot.jpg',
                date: '12/10/23',
                permalink: 'eliot'
            }
        ];

        function createPost(post) {
            const isVideo = post.image.endsWith('.mp4');
            const mediaElement = isVideo 
                ? `<div class="relative group cursor-pointer">
                    <video class="w-full h-auto" preload="metadata" poster="assets/video-poster.png">
                        <source src="${post.image}" type="video/mp4">
                    </video>
                    <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/50 transition-all duration-300">
                        <div class="transform scale-0 group-hover:scale-100 transition-transform duration-300">
                            <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="absolute bottom-2 right-2 bg-black/50 text-white text-[8px] px-2 py-1 rounded">
                        MP4
                    </div>
                </div>`
                : `<img src="${post.image}" alt="Post" class="w-full h-auto">`;

            return `
                <div class="bg-cherry-purple overflow-hidden">
                    <a href="./image.html#${post.permalink}" class="block">
                        ${mediaElement}
                    </a>
                    <div class="text-center py-[5px]">
                        <a href="./image.html#${post.permalink}" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">
                            ${post.date}
                        </a>
                    </div>
                    <hr class="border-dotted border-cherry-accent w-full border-t-[0.2px] my-0">
                </div>
            `;
        }

        function loadPosts() {
            const postsContainer = document.querySelector('.grid');
            posts.forEach(post => {
                postsContainer.innerHTML += createPost(post);
            });
        }

        // Load posts when the page loads
        window.onload = loadPosts;
    </script>
</body>
</html>
