        /* Theme styles */

            --text-color: #000000;

        /* Light theme */
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #cccccc;
            --hover-color: #666666;
            --card-bg: #f5f5f5;

        /* Dark theme */
        [data-theme="dark"] {

            --accent-color: #333333;
            --hover-color: #B55FFF;
            --card-bg: #1e1e1e;

        body.theme-enabled {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .theme-enabled .bg-cherry-purple {
            background-color: var(--bg-color) !important;
        }
        
        .theme-enabled .text-black {

        .theme-enabled .hover\:text-cherry-hover:hover {

        .theme-enabled hr.border-cherry-accent {

        }
        
        .theme-enabled .p-2.bg-cherry-purple {
            background-color: var(--card-bg) !important;
        }
        
        /* Theme switcher */
        .theme-switcher {

            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            cursor: pointer;
            border: 2px solid #ffffff;
            transition: transform 0.2s;

        .theme-btn:hover {

        .theme-btn.purple {

        }
        
        .theme-btn.light {
            background-color: #ffffff;
        }
        
        .theme-btn.dark {

    <script>
    // Music Player Logic
    const playlist = [
        {
            title: 'Two',
            artist: 'Cult Member',
            src: 'assets/music/Two- Cult Member.m4a',
            albumArt: 'assets/images/Album/two.jpeg',
        },
        {
            title: 'Clouds',
            artist: 'Pastel Ghost',
            src: 'assets/music/Clouds- Pastel Ghost.m4a',
            albumArt: 'assets/images/Album/abyss.jpeg'
        },
        {
            title: 'Warmpop',
            artist: 'Esprit George Clanton',
            src: 'assets/music/Warmpop- Esprit George Clanton.m4a',
            albumArt: 'assets/images/Album/two.jpeg'
        },
        {
            title: 'Celeste',
            artist: 'Krosia',
            src: 'assets/music/Celeste- Krosia.m4a',
            albumArt: 'assets/images/Album/two.jpeg'
        },
        {
            title: 'U Werent Here I Really Miss You',
            artist: 'Cult Member',
            src: 'assets/music/U Werent Here I Really Miss You- Cult Member.m4a',
            albumArt: 'assets/images/Album/two.jpeg'
        },
        {
            title: 'Three',
            artist: 'Cult Member',
            src: 'assets/music/Three- Cult Member.m4a',
            albumArt: 'assets/images/Album/two.jpeg'
        },
        {
            title: 'Ten',
            artist: 'Cult Member',
            src: 'assets/music/Ten- Cult Member.m4a',
            albumArt: 'assets/images/Album/two.jpeg'
        }
    ];
    let currentTrack = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audio = document.getElementById('player-audio');
    const playBtn = document.getElementById('player-play');
    const playIcon = document.getElementById('player-play-icon');
    const prevBtn = document.getElementById('player-prev');
    const nextBtn = document.getElementById('player-next');
    const shuffleBtn = document.getElementById('player-shuffle');
    const repeatBtn = document.getElementById('player-repeat');
    const progress = document.getElementById('player-progress');
    const progressBar = document.getElementById('player-progress-bar');
    const currentTimeEl = document.getElementById('player-current');
    const durationEl = document.getElementById('player-duration');
    const volume = document.getElementById('player-volume');
    const volumeBar = document.getElementById('player-volume-bar');
    const titleEl = document.getElementById('player-title');
    const artistEl = document.getElementById('player-artist');
    const albumArtEl = document.getElementById('player-album-art');
    const volumeBtn = document.querySelector('.flex.items-center.gap-2 button');
    const volumeIcon = volumeBtn.querySelector('svg');
    let previousVolume = 1;

    function loadTrack(index) {
        const track = playlist[index];
        audio.src = track.src;
        titleEl.textContent = track.title;
        artistEl.textContent = track.artist;
        albumArtEl.src = track.albumArt;
        progress.value = 0;
        progressBar.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = '0:00';
    }

    function playTrack() {
        audio.play();
        isPlaying = true;
        playIcon.innerHTML = '<path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"></path>';
    }

    function pauseTrack() {
        audio.pause();
        isPlaying = false;
        playIcon.innerHTML = '<path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path>';
    }

    playBtn.onclick = () => {
        if (isPlaying) {
            pauseTrack();
        } else {
            playTrack();
        }
    };

    prevBtn.onclick = () => {
        if (audio.currentTime > 2) {
            audio.currentTime = 0;
        } else {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
            playTrack();
        }
    };

    nextBtn.onclick = () => {
        if (isShuffle) {
            let next;
            do {
                next = Math.floor(Math.random() * playlist.length);
            } while (next === currentTrack && playlist.length > 1);
            currentTrack = next;
        } else {
            currentTrack = (currentTrack + 1) % playlist.length;
        }
        loadTrack(currentTrack);
        playTrack();
    };

    shuffleBtn.onclick = () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('text-cherry-hover', isShuffle);
    };

    repeatBtn.onclick = () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('text-cherry-hover', isRepeat);
    };

    audio.onloadedmetadata = () => {
        progress.max = Math.floor(audio.duration);
        durationEl.textContent = formatTime(audio.duration);
    };

    audio.ontimeupdate = () => {
        progress.value = Math.floor(audio.currentTime);
        progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    };

    progress.oninput = (e) => {
        audio.currentTime = e.target.value;
        progressBar.style.width = `${(e.target.value / progress.max) * 100}%`;
    };

    audio.onended = () => {
        if (isRepeat) {
            playTrack();
        } else {
            nextBtn.onclick();
        }
    };

    function toggleMute() {
        if (audio.volume > 0) {
            previousVolume = audio.volume;
            audio.volume = 0;
            volume.value = 0;
            volumeBar.style.width = '0%';
            volumeIcon.innerHTML = '<path d="M13.86 5.47a.75.75 0 0 0-1.061 0l-1.47 1.47-1.47-1.47A.75.75 0 0 0 8.8 6.53L10.269 8l-1.47 1.47a.75.75 0 1 0 1.06 1.06l1.47-1.47 1.47 1.47a.75.75 0 0 0 1.06-1.06L12.39 8l1.47-1.47a.75.75 0 0 0 0-1.06z"></path>';
        } else {
            audio.volume = previousVolume;
            volume.value = previousVolume;
            volumeBar.style.width = `${previousVolume * 100}%`;
            volumeIcon.innerHTML = '<path d="M9.741.85a.75.75 0 0 1 .375.65v13.5a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1 0-6.3l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.142 2.142 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"></path>';
        }
    }

    volumeBtn.onclick = toggleMute;

    volume.oninput = (e) => {
        const newVolume = parseFloat(e.target.value);
        audio.volume = newVolume;
        volumeBar.style.width = `${newVolume * 100}%`;
        
        // Update volume icon based on volume level
        if (newVolume === 0) {
            volumeIcon.innerHTML = '<path d="M13.86 5.47a.75.75 0 0 0-1.061 0l-1.47 1.47-1.47-1.47A.75.75 0 0 0 8.8 6.53L10.269 8l-1.47 1.47a.75.75 0 1 0 1.06 1.06l1.47-1.47 1.47 1.47a.75.75 0 0 0 1.06-1.06L12.39 8l1.47-1.47a.75.75 0 0 0 0-1.06z"></path>';
        } else if (newVolume < 0.5) {
            volumeIcon.innerHTML = '<path d="M9.741.85a.75.75 0 0 1 .375.65v13.5a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1 0-6.3l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.142 2.142 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"></path>';
        } else {
            volumeIcon.innerHTML = '<path d="M9.741.85a.75.75 0 0 1 .375.65v13.5a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1 0-6.3l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.142 2.142 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"></path>';
        }
    };

    // Initialize
    loadTrack(currentTrack);
    audio.volume = 1;
    </script>

                image: 'assets/images/470c52a8002bb963b5d9e298ff24acb3.jpg',
                date: '12/13/23',
                permalink: '470c52a8002bb963b5d9e298ff24acb3'
            },
            {
                image: 'assets/images/442c78f308c20d8e2d51cd9d669c7951.jpg',
                date: '12/13/23',
                permalink: '442c78f308c20d8e2d51cd9d669c7951'
            }
        ];

        function createPost(post) {
            const isVideo = post.image.endsWith('.mp4');
            const mediaElement = isVideo 
                ? `<div class="relative group cursor-pointer mb-2">
                    <video class="w-full" preload="metadata" poster="assets/video-poster.png">
                        <source src="${post.image}" type="video/mp4">
                    </video>
                    <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-black/50 transition-all duration-300">
                        <div class="transform scale-0 group-hover:scale-100 transition-transform duration-300">
                            <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="absolute bottom-2 right-2 bg-black/50 text-white text-[8px] px-2 py-1 rounded">
                        MP4
                    </div>
                </div>`
                : `<div class="mb-2">
                    <img src="${post.image}" alt="Post" class="w-full">
                </div>`;

            return `
                <div class="bg-cherry-purple overflow-hidden break-inside-avoid">
                    <a href="./image.html#${post.permalink}" class="block">
                        ${mediaElement}
                    </a>
                    <!-- <div class="text-center py-[5px]">
                        <a href="./image.html#${post.permalink}" class="text-black no-underline hover:text-cherry-hover transition-colors duration-300">
                            ${post.date}
                        </a>
                    </div> -->
                    <hr class="border-dotted border-cherry-accent w-full border-t-[0.2px] my-0">
                </div>
            `;
        }

        function loadPosts() {
            const postsContainer = document.querySelector('.columns-3');
            posts.forEach(post => {
                postsContainer.innerHTML += createPost(post);
            });
        }

        // Load posts when the page loads
        window.onload = function() {
            loadPosts();
            initThemeSwitcher();
        };
        
        // Theme switcher functionality
        function initThemeSwitcher() {
            const themeButtons = document.querySelectorAll('.theme-btn');
            const savedTheme = localStorage.getItem('cherrypalace-theme');
            
            // Apply saved theme if it exists
            if (savedTheme) {
                applyTheme(savedTheme);
                
                // Update active button
                themeButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.theme === savedTheme) {
                        btn.classList.add('active');
                    }
                });
            }
            
            // Add click event listeners to theme buttons
            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const theme = this.dataset.theme;
                    
                    // Update active button
                    themeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Apply theme
                    applyTheme(theme);
                    
                    // Save theme preference
                    localStorage.setItem('cherrypalace-theme', theme);
                });
            });
        }
        
        function applyTheme(theme) {
            const body = document.body;
            
            // Remove existing theme classes
            body.classList.remove('theme-enabled');
            body.removeAttribute('data-theme');
            
            // Apply new theme if not default
            if (theme !== 'default') {
                body.classList.add('theme-enabled');
                body.setAttribute('data-theme', theme);
            }
        }
    </script>
</body>
</html>
